{% extends "layout.html" %}

{% block title %}Register - QR Code Attendance System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-dark text-white text-center">
                <h4>Create Account</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('register_page') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username *</label>
                        <input type="text" name="username" id="username" class="form-control" required autofocus placeholder="Choose a username">
                    </div>

                    <div class="mb-3">
                        <label for="employee_id" class="form-label">Employee ID</label>
                        <input type="text" name="employee_id" id="employee_id" class="form-control" placeholder="e.g., EMP001 (optional)">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password *</label>
                        <input type="password" name="password" id="password" class="form-control" required placeholder="Minimum 4 characters">
                    </div>

                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirm Password *</label>
                        <input type="password" name="confirm_password" id="confirm_password" class="form-control" required placeholder="Re-enter password">
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Register</button>
                    </div>
                </form>

                <hr>

                <div class="text-center">
                    <p class="mb-0">Already have an account?</p>
                    <a href="{{ url_for('login_page') }}" class="btn btn-outline-secondary">Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
